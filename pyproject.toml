[project]
name = "image-semantic-search"
version = "1.0.0"
description = "基于 EmbeddingGemma 2 的语义图片搜索"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "sentence-transformers>=6.1.0",
    "transformers>=5",
    "fastapi",
    "uvicorn[standard]",
    "pillow",
    "numpy",
    "faiss-cpu",
    "soundfile",
    "av",
    "pypdf",
    "python-docx",
]

# torch CUDA 版托管在 pytorch 官方索引（PyPI 上的 Windows 默认版是 CPU 版）
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
